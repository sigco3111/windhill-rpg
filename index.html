<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>바람 언덕의 유랑자 - 프로토타입</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #87b5d9; touch-action: none; font-family: 'Noto Sans KR', sans-serif; }
    #app { position: fixed; inset: 0; }
    #loading {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(#79b5e8, #a8d5a2); color: #1d2b1d;
      font-family: 'Noto Sans KR', sans-serif;
    }
    #loading .ttl { font-size: 24px; font-weight: 700; }
    #loading #loadmsg { font-size: 14px; }
    #loading button { margin-top: 14px; padding: 10px 24px; font-size: 16px; border: 0; border-radius: 8px; background: #2f6d2f; color: #fff; }
    #hud {
      position: fixed; top: 8px; left: 8px; color: #fff; font: 12px/1.5 'Noto Sans KR', sans-serif;
      background: rgba(0,0,0,.35); padding: 6px 8px; border-radius: 6px; pointer-events: none;
      white-space: pre; z-index: 10;
    }
    #msg {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: #fff; font: 13px 'Noto Sans KR', sans-serif; background: rgba(0,0,0,.35);
      padding: 6px 12px; border-radius: 6px; pointer-events: none; z-index: 10;
      max-width: 92vw; text-align: center; word-break: keep-all;
    }
    #hpwrap {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      width: 220px; height: 14px; background: rgba(0,0,0,.4); border-radius: 7px;
      overflow: hidden; z-index: 10; border: 1px solid rgba(255,255,255,.35);
    }
    #hpfill { height: 100%; width: 100%; background: #5ad06a; transition: width .15s; }
    #atk {
      position: fixed; right: 22px; bottom: 60px; width: 72px; height: 72px; border-radius: 50%;
      background: rgba(200,60,50,.75); color: #fff; font: 700 15px 'Noto Sans KR', sans-serif;
      display: flex; align-items: center; justify-content: center; z-index: 11;
      border: 2px solid rgba(255,255,255,.6); user-select: none; -webkit-user-select: none;
    }
    #snd {
      position: fixed; top: 10px; right: 10px; padding: 6px 10px; border-radius: 14px;
      background: rgba(20,40,70,.7); color: #fff; font: 600 12px 'Noto Sans KR', sans-serif;
      border: 1px solid rgba(255,255,255,.4); z-index: 11; cursor: pointer;
      user-select: none; -webkit-user-select: none;
    }
    #auto {
      position: fixed; top: 44px; right: 10px; padding: 6px 10px; border-radius: 14px;
      background: rgba(70,40,20,.7); color: #fff; font: 600 12px 'Noto Sans KR', sans-serif;
      border: 1px solid rgba(255,255,255,.4); z-index: 11; cursor: pointer;
      user-select: none; -webkit-user-select: none;
    }
    #auto.on { background: rgba(160,80,20,.85); }
    #gold {
      position: fixed; left: 8px; bottom: 8px; color: #ffe9a8; font: 600 13px 'Noto Sans KR', sans-serif;
      background: rgba(0,0,0,.35); padding: 5px 10px; border-radius: 6px;
      pointer-events: none; z-index: 10; display: none;
    }
    .cbtn {
      position: fixed; right: 26px; width: 56px; height: 56px; border-radius: 50%;
      color: #fff; font: 700 12px 'Noto Sans KR', sans-serif;
      display: flex; align-items: center; justify-content: center; z-index: 11;
      border: 2px solid rgba(255,255,255,.6); user-select: none; -webkit-user-select: none;
      text-align: center;
    }
    #dodge { bottom: 146px; background: rgba(60,90,180,.75); }
    #pot { bottom: 214px; background: rgba(160,60,140,.75); }
    #inv { bottom: 282px; background: rgba(40,110,80,.75); cursor: pointer; }
    #skill { bottom: 350px; background: rgba(90,60,160,.75); cursor: pointer; }
    #whirl { right: 106px; bottom: 62px; background: rgba(30,120,140,.8); font-size: 10px; }
    #over {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.55); color: #fff; font: 700 20px 'Noto Sans KR', sans-serif;
      z-index: 20; text-align: center; cursor: pointer;
    }
    #prompt {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      display: none; color: #fff; font: 600 13px 'Noto Sans KR', sans-serif;
      background: rgba(20,60,120,.8); padding: 8px 16px; border-radius: 18px;
      border: 1px solid rgba(255,255,255,.5); z-index: 12; cursor: pointer;
      user-select: none; -webkit-user-select: none;
    }
    #quest {
      position: fixed; top: 78px; right: 8px; color: #fff; font: 12px/1.5 'Noto Sans KR', sans-serif;
      background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 6px;
      pointer-events: auto; cursor: pointer; z-index: 10; display: none; text-align: right;
    }
    #nav {
      position: fixed; top: 170px; left: 8px; color: #ffe9a8; font: 12px/1.5 'Noto Sans KR', sans-serif;
      background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 6px;
      pointer-events: none; z-index: 10; display: none; text-align: left;
    }
    #nav .arrow { display: inline-block; font-size: 13px; }
    #tut {
      position: fixed; top: 34px; left: 50%; transform: translateX(-50%);
      display: none; color: #fff; font: 13px/1.6 'Noto Sans KR', sans-serif; text-align: center;
      background: rgba(20,40,80,.85); padding: 8px 16px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.4); z-index: 12; max-width: 80vw;
    }
    #tut .skip {
      display: block; margin-top: 2px; font-size: 10px; opacity: .75;
      cursor: pointer; pointer-events: auto; text-decoration: underline;
    }
    #toast {
      position: fixed; top: 110px; left: 50%; transform: translateX(-50%);
      color: #ffe9a8; font: 600 14px 'Noto Sans KR', sans-serif; z-index: 12;
      pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 3px #000;
    }
    #minimap {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      background: rgba(8,14,22,.55); border: 1px solid rgba(255,255,255,.3); border-radius: 8px;
      cursor: pointer; user-select: none; -webkit-user-select: none;
    }
    #minimap.off { display: none; }
    #minimap.big { width: 240px; height: 240px; }
    #dlgback {
      position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 24; display: none;
    }
    #dlg {
      position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
      display: none; width: min(440px, 92vw); background: #12161e;
      border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 14px 16px;
      color: #eee; font: 14px/1.6 'Noto Sans KR', sans-serif; z-index: 25;
      max-height: calc(100vh - 170px); overflow-y: auto;
    }
    #dlg .shoprow {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 7px 0; border-top: 1px solid rgba(255,255,255,.12); text-align: left;
    }
    #dlg .shoprow .info { flex: 1; min-width: 0; word-break: keep-all; }
    #dlg #dlg-text { word-break: keep-all; }
    #dlg .shoprow .info small { color: #9fb4c8; }
    #dlg .shoprow button { flex-shrink: 0; min-width: 74px; }
    #dlg h3 { margin: 0 0 6px; font-size: 15px; color: #ffd98a; }
    #dlg .btns { position: sticky; bottom: -14px; background: #12161e; padding: 8px 0 2px; margin: 0 -2px; }
    #dlg { scrollbar-width: thin; }
    #dlg .btns { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    #dlg button {
      font: 600 13px 'Noto Sans KR', sans-serif; color: #fff; background: #3a6db5;
      border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer;
    }
    #dlg button.sub { background: #555; }
    /* 메뉴 (설정/기록/초기화) */
    #menuBtn {
      position: fixed; top: 10px; right: 86px; padding: 6px 10px; border-radius: 14px;
      background: rgba(50,60,50,.7); color: #fff; font: 600 12px 'Noto Sans KR', sans-serif;
      border: 1px solid rgba(255,255,255,.4); z-index: 11; cursor: pointer;
      user-select: none; -webkit-user-select: none;
    }
    #menuback { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 26; display: none; }
    #menudlg {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
      display: none; width: min(460px, 94vw); max-height: calc(100vh - 48px); overflow-y: auto;
      background: #12161e; border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
      padding: 12px 14px; color: #eee; font: 14px/1.6 'Noto Sans KR', sans-serif;
      z-index: 27; scrollbar-width: thin;
    }
    #menudlg .mtabs {
      display: flex; gap: 6px; margin-bottom: 8px; position: sticky; top: -12px;
      background: #12161e; padding: 4px 0; z-index: 1;
    }
    #menudlg .mtabs button {
      font: 600 13px 'Noto Sans KR', sans-serif; color: #fff; background: #2a3342;
      border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer;
    }
    #menudlg .mtabs button.on { background: #3a6db5; }
    #menudlg .mtabs button.sub { background: #555; margin-left: auto; }
    #menudlg .mrow {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 7px 0; border-top: 1px solid rgba(255,255,255,.12); word-break: keep-all;
    }
    #menudlg .mrow small { color: #9fb4c8; }
    #menudlg button.act {
      font: 600 13px 'Noto Sans KR', sans-serif; color: #fff; background: #3a6db5;
      border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; flex-shrink: 0;
    }
    #menudlg button.danger { background: #b53a3a; }
    #menudlg button:disabled { opacity: .4; cursor: default; }
    #menudlg input {
      background: #0b0f16; color: #fff; border: 1px solid rgba(255,255,255,.3);
      border-radius: 6px; padding: 7px 10px; font: 14px 'Noto Sans KR', sans-serif; width: 110px;
    }
    #menudlg .recgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    /* 작은 화면: HUD 겹침·가림 방지 */
    @media (max-height: 500px) {
      .cbtn { width: 46px; height: 46px; right: 16px; font-size: 10px; }
      #dodge { bottom: 104px; }
      #pot { bottom: 158px; }
      #inv { bottom: 212px; }
      #skill { bottom: 266px; }
      #atk { width: 56px; height: 56px; right: 14px; bottom: 40px; font-size: 12px; }
      #whirl { right: 84px; bottom: 96px; width: 46px; height: 46px; font-size: 9px; }
      #msg { display: none; }
    }
    @media (max-width: 640px) {
      #hud { font-size: 10px; padding: 4px 6px; }
      #hpwrap { top: auto; bottom: 52px; left: 8px; transform: none; width: 130px; height: 10px; }
      #quest { top: 66px; font-size: 10px; padding: 4px 6px; max-width: 40vw; }
      #nav { top: 116px; left: 8px; font-size: 10px; padding: 3px 8px; }
      #auto { top: 38px; font-size: 10px; padding: 5px 8px; }
      #gold { bottom: 66px; font-size: 11px; padding: 4px 8px; }
      .cbtn { width: 46px; height: 46px; right: 16px; font-size: 10px; }
      #dodge { bottom: 104px; }
      #pot { bottom: 158px; }
      #inv { bottom: 212px; }
      #skill { bottom: 266px; }
      #whirl { right: 84px; bottom: 96px; width: 46px; height: 46px; font-size: 9px; }
      #msg { display: none; }
      #tut { top: 112px; font-size: 11px; padding: 6px 12px; max-width: 70vw; }
      #toast { top: 96px; font-size: 12px; }
      #minimap { width: 96px; height: 96px; }
      #msg { font-size: 10px; bottom: 8px; padding: 4px 8px; max-width: 70vw; }
      #atk { width: 56px; height: 56px; right: 14px; bottom: 40px; font-size: 12px; }
      #prompt { bottom: 96px; font-size: 11px; padding: 6px 12px; }
      #dlg { bottom: 40px; font-size: 12px; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading"><div class="ttl">바람 언덕의 유랑자</div><div id="loadmsg">불러오는 중…</div></div>
  <div id="hud"></div>
  <canvas id="minimap" width="150" height="150" title="미니맵 (M)"></canvas>
  <div id="msg">WASD 이동 · Shift 달리기 · Space/클릭 공격(길게 강공격) · Q 회피 · R 물약 · T 자동 전투 · I 가방 · M 미니맵 · F 회전베기 · K 스킬 · 드래그 시점 · Esc 메뉴</div>
  <div id="hpwrap"><div id="hpfill"></div></div>
  <div id="atk">공격</div>
  <div id="snd">소리 끔</div>
  <div id="auto">자동 전투 OFF</div>
  <div id="menuBtn">☰ 메뉴</div>
  <div id="gold"></div>
  <div id="dodge" class="cbtn">회피</div>
  <div id="pot" class="cbtn">물약 0</div>
  <div id="inv" class="cbtn">가방</div>
  <div id="skill" class="cbtn">스킬</div>
  <div id="whirl" class="cbtn" style="display:none">회전베기</div>
  <div id="over">쓰러졌습니다<br><span style="font-size:14px;font-weight:400">탭하면 마을에서 다시 일어납니다</span></div>
  <div id="prompt">E · 대화하기</div>
  <div id="quest"></div>
  <div id="nav"><span class="arrow" id="navarrow">▲</span> <span id="navtext"></span></div>
  <div id="tut"><span id="tuttext"></span><span class="skip" id="tutskip">건너뛰기</span></div>
  <div id="toast"></div>
  <div id="menuback"></div>
  <div id="menudlg">
    <div class="mtabs" id="menutabs">
      <button data-tab="set" class="on">설정</button>
      <button data-tab="rec">기록</button>
      <button data-tab="reset">초기화</button>
      <button id="menuclose" class="sub">닫기 ✕</button>
    </div>
    <div id="menubody"></div>
  </div>
  <div id="dlgback"></div>
  <div id="dlg"><h3 id="dlg-name"></h3><div id="dlg-text"></div><div id="dlg-list"></div><div class="btns" id="dlg-btns"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
